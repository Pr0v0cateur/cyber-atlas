<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latest CVEs | Cyber Atlas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/sidebar.css?v=20260129a">
    <link rel="stylesheet" href="css/pages.css?v=20260129a">
</head>

<body class="page-shell">
    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content">
            <header class="page-header">
                <div class="page-title">
                    <h1>Latest CVEs</h1>
                    <p>Latest entries from the CISA Known Exploited Vulnerabilities catalog.</p>
                </div>
                <div class="page-actions">
                    <button class="page-filter-btn is-active" type="button" data-cve-sort="latest">
                        Latest
                    </button>
                    <button class="page-filter-btn" type="button" data-cve-sort="critical" data-days="30">
                        Most Critical (30d)
                    </button>
                </div>
            </header>

            <section class="page-grid" id="cves-page">
                <div class="page-card">
                    <div class="page-card-header">
                        <div>
                            <h3>CISA KEV Catalog</h3>
                            <p class="page-subtext">Known exploited vulnerabilities sorted by the selected view.</p>
                        </div>
                        <span class="page-meta" id="cves-meta"></span>
                    </div>
                    <div id="cves-list" class="page-list"></div>
                    <div id="cves-pagination"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/sidebar.js?v=20260129a"></script>
    <script src="js/page-utils.js?v=20260115b"></script>
    <script src="js/pages.js?v=20260129a"></script>
</body>

</html>
