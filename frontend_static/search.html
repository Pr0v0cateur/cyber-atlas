<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOC Search | Cyber Atlas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/sidebar.css?v=20260129a">
    <link rel="stylesheet" href="css/pages.css?v=20260129a">
</head>

<body class="page-shell">
    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-content">
            <header class="page-header">
                <div class="page-title">
                    <h1>IOC Search</h1>
                    <p>Search indicators and enrichment data across all feeds.</p>
                </div>
            </header>

            <section class="page-grid two-col" id="search-page">
                <div class="page-card">
                    <h3>Search</h3>
                    <form id="ioc-search-form" class="page-search">
                        <input id="ioc-search-input" type="text" placeholder="Enter domain, IP, URL, hash..." />
                        <button type="submit">Search</button>
                    </form>
                    <div id="ioc-search-results" style="margin-top: 16px;"></div>
                </div>
                <div id="ioc-search-enrichment"></div>
            </section>
        </main>
    </div>

    <script src="js/sidebar.js?v=20260129a"></script>
    <script src="js/page-utils.js?v=20260115b"></script>
    <script src="js/pages.js?v=20260129a"></script>
</body>

</html>
